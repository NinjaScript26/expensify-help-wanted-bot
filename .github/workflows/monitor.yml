name: Monitor Expensify Help Wanted

# NIGHT SHIFT: runs only during Frankfurt 18:00-08:00.
#
# GitHub cron uses UTC. Frankfurt timezone:
#   Summer (CEST, UTC+2):  Frankfurt 18:00-08:00  ==  UTC 16:00-06:00  ← currently active (April 2026)
#   Winter (CET,  UTC+1):  Frankfurt 18:00-08:00  ==  UTC 17:00-07:00
# When DST changes (last Sunday of October), shift the UTC hours by +1 to keep
# the literal Frankfurt window. For now we use the summer window.
#
# Two cron lines for redundancy — GitHub silently drops scheduled runs under load.
# Interval ~10 min × 2 lines = up to 12 attempts/hour, but actual run rate is
# usually 3-6/hour due to GitHub's free-tier scheduler throttling.
#
# API budget: even if every trigger fires, ~3 API calls per run × 12/hr × 14h
# = 504 calls per night, well under the 1,000/hr/repo GITHUB_TOKEN limit.

on:
  schedule:
    - cron: '*/10 16-23,0-5 * * *'      # every 10 min during UTC 16-23 + 0-5
    - cron: '5,25,45 16-23,0-5 * * *'   # extra triggers offset by 5 min
  workflow_dispatch:                     # also allows manual runs

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python monitor.py

      - name: Commit updated state
        run: |
          if [[ -n "$(git status --porcelain seen_issues.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_issues.json
            git commit -m "Update seen_issues.json"
            git push
          else
            echo "No state changes to commit."
          fi
